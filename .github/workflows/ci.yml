name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm comes from the packageManager field, so the version is pinned by
      # the repo rather than by this file.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Credentials live in the environment, never in the tree. This is cheap
      # and catches the mistake at the only point where it is still cheap.
      - name: Guard against committed credentials
        run: |
          for f in .env.local .neon; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::$f is tracked and holds live credentials"
              exit 1
            fi
          done
          # A connection string pointing at localhost is not a credential —
          # the integration job's service container is reachable by nobody —
          # so those are exempt. Anything addressing a real host is not.
          if git grep -I -n -E 'postgres(ql)?://[^:@/]+:[^@/]+@' -- . ':!.env.example' \
               | grep -vE '@(localhost|127\.0\.0\.1)([:/]|$)' \
               | grep .; then
            echo "::error::a Postgres URL with an inline password is committed"
            exit 1
          fi

      # packages/contracts is a composite project and apps/edge resolves it
      # through its dist/, so a clean checkout has to build before anything
      # type-aware runs.
      - name: Build
        run: pnpm -r --if-present build

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Lint
        run: pnpm exec eslint .

      - name: Format
        run: pnpm exec prettier --check .

      - name: Test
        run: pnpm -r --if-present test

  # Migrations are forward only and checksummed. An edit to an applied file
  # passes typecheck and lint and then fails at deploy time against a real
  # database, so it is worth catching on the pull request instead.
  migrations:
    name: migrations are forward only
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse edits to existing migrations
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only --diff-filter=MD "$base"...HEAD -- 'db/*.sql')
          if [ -n "$changed" ]; then
            echo "::error::migrations are forward only; these were modified or deleted:"
            echo "$changed"
            echo "Add a new numbered migration instead."
            exit 1
          fi
          echo "No existing migration was modified."

  # The worker's unit tests drive a fake database. They prove the arithmetic
  # and cannot prove the SQL — column names, the events -> exposures join, and
  # node-postgres returning numeric and bigint as strings are all invisible to
  # them. This runs the real recompute against a real Postgres with traffic
  # whose answer is known in advance.
  #
  # A service container rather than a Neon branch, deliberately: it needs no
  # credentials, so it runs on every pull request including one from a fork,
  # and it cannot write to anything that outlives the job.
  integration:
    name: worker against real postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/postgres
      # Anything but production/prod/main; the seed refuses those without
      # --force, and that refusal is itself worth not bypassing in CI.
      NEON_BRANCH: ci

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --if-present build

      - name: Apply migrations
        run: node db/migrate.mjs

      - name: Seed
        run: node db/seed.mjs

      - name: Recompute against real Postgres
        run: node .github/scripts/worker-integration.mjs
